<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>particle-portrait legacy demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --text: #8592a3;
    --border: rgba(224, 149, 79, 0.2);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  .hover-box {
    width: 380px;
    height: 380px;
    border: 1px dashed var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    cursor: default;
  }
  canvas {
    position: absolute;
    inset: 0;
    display: block;
  }
  .hint {
    position: relative;
    z-index: 1;
    pointer-events: none;
    transition: opacity 0.3s ease;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .hover-box:hover .hint {
    opacity: 0;
  }
  p.caption {
    margin: 0;
    max-width: 38ch;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hover-box" id="hoverBox">
      <canvas id="canvas"></canvas>
      <span class="hint">hover</span>
    </div>
    <p class="caption">Earlier iteration of this technique, kept for comparison — hover-triggered assemble/hold/fade, flat particle size, and a hard-edged mouse repel (see the README for what changed and why).</p>

    var canvas = document.getElementById('canvas');
    var ctx = canvas.getContext('2d');

    var DISPLAY = 380;
    var SAMPLE = 84;
    var LUM_THRESH = 26;
    var SAT_THRESH = 46;
    var HOLD_MS = 10000;
    var TAU = Math.PI * 2;

    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = DISPLAY * dpr;
    canvas.height = DISPLAY * dpr;
    ctx.scale(dpr, dpr);

    var particles = [];
    var ready = false;

    var hovering = false;
    var graceUntil = 0;
    var level = 0;
    var running = false;
    var last = 0;
    var mouse = { x: -9999, y: -9999, active: false };

    function buildParticles(img) {
      var off = document.createElement('canvas');
      off.width = SAMPLE;
      off.height = SAMPLE;
      var octx = off.getContext('2d');
      octx.drawImage(img, 0, 0, SAMPLE, SAMPLE);
      var data = octx.getImageData(0, 0, SAMPLE, SAMPLE).data;

      var scale = DISPLAY / SAMPLE;
      var cx = SAMPLE / 2, cy = SAMPLE / 2;
      var out = [];

      for (var y = 0; y < SAMPLE; y++) {
        for (var x = 0; x < SAMPLE; x++) {
          var i = (y * SAMPLE + x) * 4;
          var r = data[i], g = data[i + 1], b = data[i + 2];
          var lum = r * 0.21 + g * 0.71 + b * 0.07;
          var maxc = Math.max(r, g, b), minc = Math.min(r, g, b);
          if (lum <= LUM_THRESH || (maxc - minc) >= SAT_THRESH) continue;

          var homeX = (x - cx) * scale;
          var homeY = (y - cy) * scale;
          var angle = Math.random() * TAU;
          var dist = 100 + Math.random() * 150;
          var sx = Math.cos(angle) * dist;
          var sy = Math.sin(angle) * dist;

          out.push({
            homeX: homeX, homeY: homeY,
            scatterX: sx, scatterY: sy,
            x: homeX + sx, y: homeY + sy,
            vx: 0, vy: 0,
            phase: Math.random() * TAU,
            jitterAmp: 1 + Math.random() * 1.6,
            size: 0.9 + Math.random() * 1.4,
            baseAlpha: 0.7 + Math.random() * 0.3,
            color: 'rgb(' + r + ',' + g + ',' + b + ')'
          });
        }
      }
      return out;
    }

    var img = new Image();
    img.onload = function () {
      particles = buildParticles(img);
      ready = true;
    };
    img.src = 'data:image/jpeg;base64,' + IMG_B64;

    function ensureLoop() {
      if (!running) {
        running = true;
        last = performance.now();
        requestAnimationFrame(tick);
      }
    }

    function tick(now) {
      var dt = Math.min(48, now - last);
      last = now;

      var targetLevel = (hovering || now < graceUntil) ? 1 : 0;
      var tau = targetLevel > level ? 240 : 320;
      var a = 1 - Math.exp(-dt / tau);
      level += (targetLevel - level) * a;
      if (level < 0.001) level = 0;
      if (level > 0.999) level = 1;

      ctx.clearRect(0, 0, DISPLAY, DISPLAY);

      if (ready && level > 0.001) {
        var originX = DISPLAY / 2;
        var originY = DISPLAY / 2;
        var localMouseX = mouse.active ? mouse.x - originX : null;
        var localMouseY = mouse.active ? mouse.y - originY : null;
        var repel = mouse.active && level > 0.25;
        var radius = 42, radius2 = radius * radius;

        for (var idx = 0; idx < particles.length; idx++) {
          var p = particles[idx];

          var jx = Math.sin(now * 0.0011 + p.phase) * p.jitterAmp * level;
          var jy = Math.cos(now * 0.0014 + p.phase * 1.4) * p.jitterAmp * level;
          var tx = p.homeX + jx + (1 - level) * p.scatterX;
          var ty = p.homeY + jy + (1 - level) * p.scatterY;

          if (repel) {
            var dx = p.x - localMouseX;
            var dy = p.y - localMouseY;
            var d2 = dx * dx + dy * dy;
            if (d2 < radius2 && d2 > 0.01) {
              var d = Math.sqrt(d2);
              var force = (1 - d / radius) * 16;
              p.vx += (dx / d) * force;
              p.vy += (dy / d) * force;
            }
          }

          p.vx += (tx - p.x) * 0.032;
          p.vy += (ty - p.y) * 0.032;
          p.vx *= 0.82;
          p.vy *= 0.82;
          p.x += p.vx;
          p.y += p.vy;

          var sizeMul = 0.35 + 0.65 * level;
          ctx.globalAlpha = level * p.baseAlpha;
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(originX + p.x, originY + p.y, p.size * sizeMul, 0, TAU);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      if (level > 0 || targetLevel === 1) {
        requestAnimationFrame(tick);
      } else {
        running = false;
      }
    }

    function enterZone() {
      hovering = true;
      graceUntil = 0;
      ensureLoop();
    }

    function leaveZone() {
      hovering = false;
      graceUntil = performance.now() + HOLD_MS;
      ensureLoop();
    }

    zone.addEventListener('mouseenter', enterZone);
    zone.addEventListener('mouseleave', leaveZone);

    zone.addEventListener('mousemove', function (e) {
      var rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * (DISPLAY / rect.width);
      mouse.y = (e.clientY - rect.top) * (DISPLAY / rect.height);
      mouse.active = true;
    });
  })();
  </script>
