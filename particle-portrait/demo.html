<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>particle-portrait demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e14;
    --text: #8592a3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font: 14px/1.6 -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--text);
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }
  canvas {
    display: block;
  }
  p {
    margin: 0;
    max-width: 32ch;
    text-align: center;
  }
</style>
</head>

    <canvas id="canvas" width="420" height="420" style="width:420px;height:420px"></canvas>
    <p>Move your cursor over the particles.</p>
  </div>
